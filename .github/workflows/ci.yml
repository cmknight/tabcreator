name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag past v7, so pin the release.
      - uses: astral-sh/setup-uv@v10.2.0

      # Regenerates testdata/synth/ from tools/make_fixtures.py (pinned by its .lock); any
      # difference means a generator is not deterministic or its outputs were not committed.
      - name: Generate fixtures
        run: uv run --locked tools/make_fixtures.py

      # The pYIN oracle runs librosa on the engine's own pre-processed signal, which the script
      # gets from `cargo run --example dump_preprocessed`. Rust 1.98.1, from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # Regenerates the librosa pYIN oracle in testdata/pyin/ (US-4.2) from the fixtures above,
      # pinned by tools/reference_pyin.py.lock; the check below catches stale oracle files.
      - name: Generate pYIN oracle
        run: uv run --locked tools/reference_pyin.py

      - name: Fixtures match the committed files
        run: |
          git add --intent-to-add testdata
          git diff --exit-code -- testdata

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      # pnpm 12.6.0, read from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Rust 1.98.1 with rustfmt, clippy and the wasm32 target, read from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: cargo fmt
        working-directory: engine
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: engine
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: engine
        run: cargo test --locked

      # The off-by-default `test-panic` feature (the e2e panic check's sentinel) and its test.
      - name: cargo clippy and test (test-panic feature)
        working-directory: engine
        run: |
          cargo clippy --locked --all-targets --features test-panic -- -D warnings
          cargo test --locked --lib --features test-panic

      # US-8.4: the fixture accuracy report and its threshold gates (F1, octave errors and fret
      # agreement on the gate sets; the step fails when one is missed), built in release
      # so its analyze timing is meaningful. Published to the job summary and as an artifact
      # even when a later step fails.
      # Also the gate against main (AD-7, CAP-23): main's committed baseline and output hashes
      # are read through `git show`; a file main lacks leaves its check skipped.
      - name: Accuracy report
        working-directory: engine
        env:
          ACCURACY_REPORT: ${{ runner.temp }}/accuracy-report.md
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          compare=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            compare="origin/$BASE_REF"
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
          elif [ "$REF" = "refs/heads/main" ]; then
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              compare="$BEFORE"
              git fetch --no-tags --depth=1 origin "$BEFORE" || true
            fi
          else
            compare="origin/main"
            git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main" || true
          fi
          if [ -n "$compare" ]; then
            if ! git rev-parse --verify --quiet "$compare^{commit}" > /dev/null; then
              echo "::error::cannot resolve comparison commit $compare"
              exit 1
            fi
            echo "Comparing against $compare"
            if git show "$compare:engine/tests/accuracy-baseline.json" > "$RUNNER_TEMP/main-accuracy-baseline.json" 2>/dev/null; then
              export ACCURACY_MAIN_BASELINE="$RUNNER_TEMP/main-accuracy-baseline.json"
            else
              echo "::notice::$compare has no copy of engine/tests/accuracy-baseline.json (metric gate skipped)"
            fi
            if git show "$compare:engine/tests/fixture-outputs.json" > "$RUNNER_TEMP/main-fixture-outputs.json" 2>/dev/null; then
              export ACCURACY_MAIN_OUTPUTS="$RUNNER_TEMP/main-fixture-outputs.json"
            else
              echo "::notice::$compare has no copy of engine/tests/fixture-outputs.json (hash gate skipped)"
            fi
          fi
          echo "ACCURACY_MAIN_BASELINE=${ACCURACY_MAIN_BASELINE:-unset} ACCURACY_MAIN_OUTPUTS=${ACCURACY_MAIN_OUTPUTS:-unset}"
          cargo test --release --locked --test fixtures

      - name: Accuracy report to job summary
        if: always()
        env:
          ACCURACY_REPORT: ${{ runner.temp }}/accuracy-report.md
        run: |
          if [ -f "$ACCURACY_REPORT" ]; then
            cat "$ACCURACY_REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accuracy-report
          path: ${{ runner.temp }}/accuracy-report.md
          if-no-files-found: ignore

      # Lint and typecheck need the generated app/src/engine/pkg/.
      - name: Build engine
        run: pnpm build:engine

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Stylelint
        run: pnpm stylelint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: No fake mic in the production bundle
        run: |
          if grep -rE 'fakeMic|FakeMic|fake-mic-|Fake mic:|testdata' app/dist; then
            echo "::error::fake mic code or test fixtures found in app/dist"
            exit 1
          fi
          if [ -n "$(find app/dist -name '*.wav')" ]; then
            find app/dist -name '*.wav'
            echo "::error::WAV files found in app/dist"
            exit 1
          fi

      - name: No dev-only test pages in the production bundle
        run: |
          if grep -rE '__test|StorageTestPage|UiTestPage|maxTakeMs|warnLeadMs|__storageFullHook|__analysisFailHook|__commitStorageFullHook|slowAnalysis|holdAnalysis|__playbackTrace' app/dist; then
            echo "::error::dev-only test page code, the dev take-length override, the storage-full hook, the dev analysis hooks or the playback trace found in app/dist"
            exit 1
          fi
          if [ -n "$(find app/dist -name '*fake-mic*' -o -name '*TestPage*')" ]; then
            find app/dist -name '*fake-mic*' -o -name '*TestPage*'
            echo "::error::fake mic or dev test page chunks found in app/dist"
            exit 1
          fi

      # The test-only `test-panic` engine (sentinel panic) must never reach the production bundle;
      # its panic string would sit in the wasm data section.
      - name: No test-panic engine in the production bundle
        run: |
          if grep -rE 'test-panic|sentinel sample rate' app/dist; then
            echo "::error::test-panic engine code found in app/dist"
            exit 1
          fi

      # Spine AD-13: the CSP meta and relative asset URLs (so the site works under /tabcreator/).
      - name: CSP and relative assets in the production bundle
        run: |
          csp="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; media-src 'self' blob:; connect-src 'self'"
          if ! grep -qF "<meta http-equiv=\"Content-Security-Policy\" content=\"$csp\"" app/dist/index.html; then
            echo "::error::app/dist/index.html lacks the CSP meta tag"
            exit 1
          fi
          if grep -nE '(src|href)="/[^/]' app/dist/index.html; then
            echo "::error::app/dist/index.html has root-absolute URLs"
            exit 1
          fi
          if grep -rn --include='*.css' 'url(/' app/dist; then
            echo "::error::app/dist CSS has root-absolute url()s"
            exit 1
          fi

      # The dist/ checked above is what Playwright tests (its web servers serve dist/ as built when
      # CI is set) and what the deploy job publishes; only pushes to main deploy, and only once
      # every job is green.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

      - name: Install Playwright Chromium
        run: pnpm --filter app exec playwright install --with-deps chromium

      # The test-only engine wasm with the `test-panic` feature, which engine.spec.ts serves in
      # place of the production wasm through a route to check a real Rust panic (US-0.2). Built
      # into engine/test-panic-pkg/, after the bundle checks and the Pages upload, so app/dist
      # holds only the production wasm.
      - name: Build test-panic engine
        run: pnpm build:engine:test-panic

      - name: Playwright
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7

  deploy:
    needs: [fixtures, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; a newer push waits rather than cancelling one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # The pages group runs deploys one at a time but not in commit order: a run whose `app` job
      # finished late must not publish over a newer commit. Skip (successfully) unless this
      # commit is still the head of main.
      - name: Still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $head; not deploying $GITHUB_SHA"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.head.outputs.current == 'true'
        uses: actions/deploy-pages@v5
