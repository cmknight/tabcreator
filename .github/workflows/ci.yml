name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      # pnpm 12.6.0, read from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Rust 1.98.1 with rustfmt, clippy and the wasm32 target, read from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: cargo fmt
        working-directory: engine
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: engine
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: engine
        run: cargo test --locked

      # Lint and typecheck need the generated app/src/engine/pkg/.
      - name: Build engine
        run: pnpm build:engine

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Stylelint
        run: pnpm stylelint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: No fake mic in the production bundle
        run: |
          if grep -r fakeMic app/dist; then
            echo "::error::fakeMic found in app/dist"
            exit 1
          fi

      - name: Install Playwright Chromium
        run: pnpm --filter app exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
