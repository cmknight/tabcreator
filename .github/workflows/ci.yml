name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      # Regenerates testdata/synth/ from tools/make_fixtures.py (pinned by its .lock); any
      # difference means the generator is not deterministic or its outputs were not committed.
      - name: Generate fixtures
        run: uv run --locked tools/make_fixtures.py

      - name: Fixtures match the committed files
        run: |
          git add --intent-to-add testdata
          git diff --exit-code -- testdata

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      # pnpm 12.6.0, read from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Rust 1.98.1 with rustfmt, clippy and the wasm32 target, read from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: cargo fmt
        working-directory: engine
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: engine
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: engine
        run: cargo test --locked

      # Lint and typecheck need the generated app/src/engine/pkg/.
      - name: Build engine
        run: pnpm build:engine

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Stylelint
        run: pnpm stylelint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: No fake mic in the production bundle
        run: |
          if grep -rE 'fakeMic|testdata' app/dist; then
            echo "::error::fake mic code or test fixtures found in app/dist"
            exit 1
          fi
          if [ -n "$(find app/dist -name '*.wav')" ]; then
            find app/dist -name '*.wav'
            echo "::error::WAV files found in app/dist"
            exit 1
          fi

      - name: No dev-only test pages in the production bundle
        run: |
          if grep -rE '__test|StorageTestPage' app/dist; then
            echo "::error::dev-only test page code found in app/dist"
            exit 1
          fi

      # Spine AD-13: the CSP meta and relative asset URLs (so the site works under /tabcreator/).
      - name: CSP and relative assets in the production bundle
        run: |
          csp="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; media-src 'self' blob:; connect-src 'self'"
          if ! grep -qF "<meta http-equiv=\"Content-Security-Policy\" content=\"$csp\"" app/dist/index.html; then
            echo "::error::app/dist/index.html lacks the CSP meta tag"
            exit 1
          fi
          if grep -q '="/assets' app/dist/index.html; then
            echo "::error::app/dist/index.html has root-absolute asset URLs"
            exit 1
          fi

      # The dist/ checked above is what the deploy job publishes (uploaded before Playwright, whose
      # web server rebuilds it); only pushes to main deploy, and only once every job is green.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

      - name: Install Playwright Chromium
        run: pnpm --filter app exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7

  deploy:
    needs: [fixtures, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; a newer push waits rather than cancelling one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
