[package]
name = "engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "TabCreator analysis engine (Rust to WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Versions pinned exactly (spine Stack, AD-7). js-sys is not in the Stack table:
# 0.3.106 is the release that requires wasm-bindgen =0.2.129 (progress callback `Function`).
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
console_error_panic_hook = "=0.1.7"

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
