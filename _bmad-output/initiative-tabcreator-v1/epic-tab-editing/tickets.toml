[[entry]]
id = 6
type = "story"
title = "Analysis settings and re-analysis"
description = "Adds the inline Analysis settings panel (Sensitivity 0–1 step 0.05 \"Fewer notes\" ↔ \"More notes\", Minimum note length 20–100 ms, Highest fret 12–24, Re-analyse as the screen's one primary button, disabled with a reason and rejecting audio-missing when neither compressed audio nor raw exists, AD-15) saving to the take, linked from 5.7's No notes found tip, the same defaults on the Settings screen stored in prefs.analysisDefaults through settings-session (whose prefs handling 5.9 adds), and the re-analyse command: locked notes replace new notes within 50 ms, new notes within 50 ms of a deletedStartMs entry are dropped, fret mapping runs with locks, a reusable Confirm dialog through overlays.ts (Cancel first and focused, destructive never the default; epic Library and export reuses it) when any note is locked, lowConfidence from the c the engine reports (5.4), and one undo step via a full snapshot restored through commitAnalysis (AD-4)."
verify = "Dev e2e on c_major_scale_pos1_noisy: sensitivity 0.2 gives fewer notes than 0.8; after editing a note, deleting another and re-analysing, the edited note is unchanged in string, fret and time and the deleted note does not return; settings persist on reopen; undo restores the previous tab and settings exactly."
covers = ["CAP-10", "CAP-11"]
after = [4]
hitl = false
risk = "high"
unknown = "Whether settings save on change (patchTake) or only inside the re-analyse command, which decides what the AD-4 snapshot restores; and whether Cancel during re-analysis leaves the tab and history untouched (reusing 5.7's progress and Cancel)."
references = ["stories — TabCreator-User-Stories.md, US-4.6", "architecture — _bmad-output/planning-artifacts/architecture/architecture-tabcreator-2026-09-28/ARCHITECTURE-SPINE.md, AD-4, AD-14"]

[[entry]]
id = 7
type = "story"
title = "Trim"
description = "Adds Trim: a 64 px waveform strip (min/max per pixel computed in an audio/ worker, not the engine worker, AD-8) with two keyboard-operable handles (←/→ 10 ms, Shift 100 ms, announced times), Save setting trimStartMs/trimEndMs and re-analysing the range as one AD-4 command (locked notes inside the range kept, times unchanged, snapshot undo; locked notes and deletedStartMs entries outside the range stay stored but hidden, user decision), Reset trim bringing them back, disabled with a reason when neither compressed audio nor raw exists, and a check that 5.10's playback follows the saved trim."
verify = "Dev e2e: trimming the first 2 s of c_major_scale_pos1 removes the notes before 2 s and leaves every later note's time unchanged, handles move by keyboard with announced times, Reset restores the full take with a locked note from outside the range back in place, undo restores the untrimmed tab, and the compressed audio file is byte-identical before and after."
covers = ["CAP-8"]
after = [6]
hitl = false
risk = "medium"
references = ["stories — TabCreator-User-Stories.md, US-3.4", "architecture — _bmad-output/planning-artifacts/architecture/architecture-tabcreator-2026-09-28/ARCHITECTURE-SPINE.md, AD-4, AD-15"]

