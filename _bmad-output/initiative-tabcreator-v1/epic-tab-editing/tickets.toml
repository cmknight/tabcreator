# tickets.toml — a container's agreed children. tickets.py reads it.
# The order of the tables is the build order: move a table to reorder. `id` names a child for good and is never reused.
# Status never lives here: an entry's plan beside it carries `status`.

[[entry]]
id = 9
type = "story"
title = "Note-building order and invariants (Detection retro R2)"
description = "Lands Detection retro R2 in engine/src/notes.rs: glide-capped notes are exempt from the octave fix (SM1, user decision), the octave fix runs before the below-range and above-highest drops so a low-string octave slip is corrected rather than counted as drop tuning (SM2), emitted confidence stays at or above c after the octave fix's 0.8 factor or the note is re-filtered (SM3), one voiced-frame helper with the 0.05 floor serves onset.rs and notes.rs (SM4), and ring-over drops a pitch-change note only with ringing evidence, a short gap since the earlier note ended and/or a different string from the middle note (SM5, user decision), with a new trill fixture whose pull-off makes no flux peak; bumps engine_version() and regenerates the committed accuracy files."
verify = "Unit tests reproduce SM1–SM5 (a 12-semitone glide keeps its octave, a low-string octave slip is corrected and not counted below range, no emitted note below c, a low-probability tail no longer extends a note, a soft trill return is kept) and fail on the old code; the release harness passes every gate, the new trill fixture's row is reported, and CI is green."
covers = ["CAP-9", "CAP-27", "CAP-28"]
after = ["5.11"]
hitl = false
risk = "medium"
unknown = "Whether the ring-over recency window can be set without moving the gated rows (the 1-point main comparison applies)."
references = ["retrospective — _bmad-output/initiative-tabcreator-v1/epic-detection-engine/epic-detection-engine-retrospective.md, action R2 and findings SM1–SM6", "decision — _bmad-output/initiative-tabcreator-v1/epic-detection-engine/epic-detection-engine.md, Notes (ring-over evidence, glide exemption, 2026-10-04)"]

[[entry]]
id = 1
type = "story"
title = "Change a fret and undo it (tracer)"
description = "Adds the edit core end to end: model/edit-history.ts (AD-4 two-phase commands plan(state) → engine requests, reduce(state, results) → state, labels, a 200-step stack, undo snapshots that cover notes and deletedStartMs), model/phrase.ts (phrases split at gaps over 1000 ms), takeSession.apply serialising commands with a Tab revision so a stale engine result is dropped and re-planned, the phrase re-fit through engineClient.mapFrets with every locked note in the phrase (locked notes and other phrases unchanged), putTab debounced 300 ms with flush on route exit and pagehide (AD-16), and the first edit, digits setting the selected note's fret (two digits within 400 ms, capped at maxFret, pitch follows), with Ctrl/⌘+Z and Ctrl/⌘+Shift+Z / Ctrl+Y, all registered in ui/a11y/shortcuts.ts; any edit locks the note, clears its flag and updates the status count (CAP-13), mapFrets null positions keep the note's current position, and a storage-full putTab shows the storage banner and keeps the pending edits for retry."
verify = "Dev e2e: typing 5 on a selected note of c_major_scale_pos1 sets fret 5, locks it, clears its flag and updates the count, survives reload, and Ctrl+Z then Ctrl+Shift+Z restore the tab exactly; Vitest covers phrase splitting, a re-fit on a multi-phrase tab leaving the other phrases byte-identical, stale-revision re-planning and the debounced save."
covers = ["CAP-11", "CAP-13", "CAP-14", "CAP-15"]
after = ["5.11"]
hitl = false
risk = "high"
unknown = "Whether a mapFrets round trip can wait behind an in-flight analyze of another take (analyses outlive their session, AD-16, and mapFrets only jumps the queue, AD-8), up to about 2 s; and what two digits above maxFret do."
references = ["architecture — _bmad-output/planning-artifacts/architecture/architecture-tabcreator-2026-09-28/ARCHITECTURE-SPINE.md, AD-3, AD-4, AD-8, AD-16", "stories — TabCreator-User-Stories.md, US-5.2, US-6.3, US-6.4"]

[[entry]]
id = 3
type = "story"
title = "String moves, delete, insert and confirm"
description = "Adds the rest of the edit set as commands: ↑/↓ move to the thinner or thicker string at the same pitch (skipping unplayable strings, nothing at the edge), Delete/Backspace deletes and records startMs in deletedStartMs (undo removes it) and selects the next note, I inserts after the selection (midpoint to the next note, or +250 ms at the end, 100 ms, same string, fret 0, confidence 1) with the fret ready to type, Enter confirms a note (locked, unflagged), Insert and Delete buttons go into the Tab toolbar (epic Analysis and tab view, entry 8), double-click opens an edit popover through a new ui/a11y/overlays.ts (one level, focus trapped and restored, AD-18) offering the fret, the other playable string positions for the same pitch and a Confirm button (user decision: the mouse path for string moves and confirm), and each edit works by mouse and keyboard."
verify = "Dev e2e on c_major_scale_pos1: each operation keyboard-only and mouse-only gives the expected note, lock and flag state and survives reload, a string move keeps the sounding pitch (by ↑/↓ and by the popover's position choices), Confirm works from the popover, a deleted note's startMs is in deletedStartMs, and the popover traps and restores focus with axe clean."
covers = ["CAP-13", "CAP-14"]
after = [1]
hitl = false
risk = "medium"
unknown = "What the selection does after deleting the last note; insert with no selection goes at the start (US-6.3)."
references = ["stories — TabCreator-User-Stories.md, US-6.3", "experience — _bmad-output/planning-artifacts/ux-designs/ux-tabcreator-2026-09-27/EXPERIENCE.md, Tab shortcuts and Component Patterns"]

[[entry]]
id = 2
type = "story"
title = "Re-fit feedback"
description = "Shows what a re-fit changed: each note whose string or fret the re-fit moved gets the dashed re-fit outline for 1.5 s (no fade under reduced motion, distinct from selection), the announcer says \"<n> nearby notes re-fingered\", the edit itself is announced (\"Moved to G string, fret 7\"), and after undo or redo the selection follows the affected note."
verify = "Dev e2e: locking the c_major_scale_pos1 note on A fret 3 to low E fret 8 announces the re-fingered count and outlines exactly the notes whose position changed for about 1.5 s; undo restores them and selects the edited note."
covers = ["CAP-11", "CAP-14", "CAP-15"]
after = [3]
hitl = false
risk = "low"
references = ["design — _bmad-output/planning-artifacts/ux-designs/ux-tabcreator-2026-09-27/DESIGN.md, re-fit and selection outline tokens", "experience — _bmad-output/planning-artifacts/ux-designs/ux-tabcreator-2026-09-27/EXPERIENCE.md, Accessibility Floor (live region)"]

