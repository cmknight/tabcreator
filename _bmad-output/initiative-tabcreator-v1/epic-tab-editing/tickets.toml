description = "Adds Undo and Redo buttons to the Tab toolbar with tooltips naming the action (\"Undo move to string 3\"), disabled states with reasons, a new edit clearing redo, undo and redo saving, and a property test: 50 random edits (frets, moves, deletes, inserts, confirms) undone fully restore the original tab and redone fully restore the final tab, with each edit and its re-fit one step."
