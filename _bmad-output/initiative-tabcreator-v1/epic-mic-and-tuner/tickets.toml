[[entry]]
id = 4
type = "story"
title = "Tuner pitch core"
description = "Builds audio/tuner.ts as pure functions slice 9 drives from slice 1's 4096-sample AnalyserNode: YIN with threshold 0.15, parabolic interpolation, 70 to 400 Hz, frames below -50 dBFS ignored, a median of five estimates, and nearest-open-string cents."
verify = "Vitest on generated sines at each open string offset by 0, 3, 10 and 25 cents reads within 1 cent, names the string for generated Karplus-Strong tones, and returns no pitch below -50 dBFS."
covers = ["CAP-4"]
after = ["1.1"]
hitl = false
risk = "high"
unknown = "Whether YIN on main-thread AnalyserNode frames reaches 1 cent on Karplus-Strong tones without the window size or threshold changing."
references = ["TabCreator-User-Stories.md, US-2.1", "testdata/synth/open_strings.json"]

[[entry]]
id = 5
type = "story"
title = "Mic errors and recovery"
description = "Maps getUserMedia failures to mic-denied, mic-no-device, mic-in-use and mic-failed and shows each in the setup card with its message, numbered recovery steps and a Try again that works without reload, shows Microphone access was lost when access is revoked or the only device goes, re-requests on return only when navigator.permissions.query for the microphone (called in audio/, AD-2) reports granted and shows the card otherwise, announces errors through slice 3's announcer, and is tested with slice 2's fake-mic hooks."
verify = "Dev Playwright shows each injected error's message and a working Try again with no prompt loop, a fake revoke or unplugging the only device shows the lost card, and on the production build a getUserMedia spy shows no call before Allow microphone."
covers = ["CAP-1", "CAP-25"]
after = [2, 3]
hitl = false
risk = "medium"
unknown = "Copy for no device, in use and failed is not in EXPERIENCE.md; the builder writes it in its Voice and Tone for review."
references = ["_bmad-output/planning-artifacts/ux-designs/ux-tabcreator-2026-09-27/EXPERIENCE.md, State Patterns (first visit, denied/no device/in use, access lost)", "_bmad-output/planning-artifacts/architecture/architecture-tabcreator-2026-09-28/ARCHITECTURE-SPINE.md, AD-10"]

[[entry]]
