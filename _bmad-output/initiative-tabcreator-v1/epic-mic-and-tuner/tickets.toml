# tickets.toml — Mic and tuner's stories in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "Mic setup card to live meter (tracer)"
description = "Adds audio/mic.ts requestMic with processing off, session/recording-session.ts holding mic state, the stream and one AnalyserNode with fftSize 4096 created in audio/ for slices 6 and 9, the setup card on Record whose Allow microphone is the only getUserMedia caller, micGranted saved through a new read-modify-write updatePrefs in storage/prefs.ts, and a plain RMS level bar that slice 6 replaces, so audio, session and UI connect end to end."
verify = "Vitest shows requestMic passes echoCancellation, noiseSuppression and autoGainControl false, channelCount 1 and deviceId exact when given, and dev Playwright with ?fakeMic=open_strings shows no getUserMedia call before Allow microphone and the bar moving within 1 s of the click."
covers = ["CAP-1", "CAP-3"]
after = ["1.1", "1.3"]
hitl = false
risk = "medium"
unknown = "Planned: recording-session writes micGranted and micDeviceId through storage/prefs.ts although AD-3 names settings-session as the prefs store; updatePrefs keeps other stores' fields."
references = ["TabCreator-User-Stories.md, US-1.1, US-1.3", "_bmad-output/planning-artifacts/ux-designs/ux-tabcreator-2026-09-27/mockups/record.html, setup card"]

[[entry]]
id = 2
type = "story"
title = "Fake mic for devices, loss and input quality"
description = "Test support for slices 5, 7 and 8: extends the dev-only fake mic with ?fakeMic=a,b as two devices, deviceId honoured with OverconstrainedError for unknown exact ids, hooks to unplug a device (devicechange plus track ended) and to revoke access (track ends, device stays listed), a hook making the next getUserMedia fail with a chosen DOMException, per-device sample-rate and label overrides, and the fixture restarting per stream."
verify = "Fake-mic dev specs show two listed devices, an unplug that fires devicechange and ends the track, a revoke that ends the track while the device stays listed, an injected NotReadableError, a 16 kHz device labelled AirPods reporting those settings, and a second stream hearing the fixture from its start; the production bundle check still finds no fake mic."
covers = []
after = ["1.4"]
hitl = false
risk = "medium"
references = ["testdata/README.md", "app/src/audio/fake-mic.ts"]

