type = "story"
title = "Level meter with warnings"
description = "Builds audio/level-meter.ts peak and RMS in dBFS from slice 1's AnalyserNode and the meter component replacing slice 1's plain bar: -60 to 0 dBFS scale, RMS fill, 1.5 s peak hold, meter colours, at least 30 fps, no easing under reduced motion, role meter with value text, Too loud at peak at or above -1 dBFS clearing after 2 s, and Too quiet after 3 s below -45 dBFS RMS, as text announced through slice 3's announcer, on Record and reusable on Tuner; after slice 5 because both edit recording-session, Record and strings.ts."
verify = "Vitest proves the dBFS maths on a full-scale sine, and dev Playwright shows Too loud within 200 ms on level_too_hot, Too quiet after 3 s on silence_60s and no warning on open_strings, with axe clean."
covers = ["CAP-3"]
after = [5]
hitl = false
risk = "medium"
unknown = "Planned: Too quiet also shows on Record before recording, following CAP-3 over EXPERIENCE.md's Level meter row (logged as a Source conflict); the under-2% CPU target is left to the budgets epic."
references = ["TabCreator-User-Stories.md, US-1.3", "_bmad-output/planning-artifacts/ux-designs/ux-tabcreator-2026-09-27/mockups/record.html, meter"]

