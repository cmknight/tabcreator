title = "Flags, warnings and bar lines on screen"
description = "Adds the status line (\"42 notes · 3 to check\"), low-confidence styling (check fill plus dotted underline, never colour alone) with \", check this note\" in flagged notes' labels, Next to check and N cycling flagged notes in time order, the tuning-off (|cents| ≥ 40) and drop-tuning warning banners with Open tuner and session dismissal (they return on reopen until re-analysis), reading the warnings entry 6 saves, the clipping banner and the Maximum length reached toast from the persisted take fields (the toast only when the Tab screen opens straight after that take's stop, not on later opens, user decision), the all-uncertain banner, and the Bar lines toggle (default on, shown only when the take has a count-in and notes), reading and writing prefs.barLines through settings-session (which gains its prefs handling here; epic Tab editing reuses it for analysis defaults; recording-session keeps its direct updatePrefs calls, which merge safely)."
verify = "Dev e2e: detuned_-45c shows the tuning banner and drop_d the drop-tuning banner, c_major_scale_pos1 shows neither, N cycles the flagged notes in order, a clipped take shows its banner, a max-length take shows the toast after its stop and not when reopened, a fixture with every note low-confidence shows the all-uncertain banner, a dismissed tuning banner returns on reopen, and a 120 BPM count-in take shows bar lines that the toggle hides and restores across reload."
covers = ["CAP-13", "CAP-24", "CAP-25", "CAP-27"]
