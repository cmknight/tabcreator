# tickets.toml — the initiative's epics in build order. tickets.py reads it.

[[epic]]
id = 1
slug = "epic-platform-baseline"
title = "Platform baseline"
covers = []

[[epic]]
id = 2
slug = "epic-mic-and-tuner"
title = "Mic and tuner"
covers = ["CAP-1", "CAP-2", "CAP-3", "CAP-4", "CAP-26", "CAP-25"]
after = [{ epic = 1, needs = "app shell, audio/ and session/ skeleton, prefs, fake mic" }]

[[epic]]
id = 3
slug = "epic-recording"
title = "Recording"
covers = ["CAP-5", "CAP-6", "CAP-7", "CAP-29", "CAP-25"]
after = [{ epic = 1, needs = "storage layer, OPFS worker, events" }, { epic = 2, needs = "mic stream and level meter" }]

[[epic]]
id = 4
slug = "epic-detection-engine"
title = "Detection engine"
covers = ["CAP-9", "CAP-11", "CAP-23", "CAP-27", "CAP-28"]
after = [{ epic = 1, needs = "engine crate, worker bridge, fixtures" }]

[[epic]]
id = 5
slug = "epic-tab-view-and-editor"
title = "Tab view and editor"
covers = ["CAP-8", "CAP-10", "CAP-11", "CAP-12", "CAP-13", "CAP-14", "CAP-15", "CAP-16", "CAP-24", "CAP-25"]
after = [{ epic = 3, needs = "recorded takes and raw audio" }, { epic = 4, needs = "analyze and map_frets with locks" }]

[[epic]]
id = 6
slug = "epic-library-and-export"
title = "Library and export"
covers = ["CAP-17", "CAP-18", "CAP-19", "CAP-25"]
after = [{ epic = 5, needs = "tab layout and toText, the Tab screen" }]

[[epic]]
id = 7
slug = "epic-offline-accessibility-budgets"
title = "Offline, accessibility and budgets"
covers = ["CAP-20", "CAP-21", "CAP-22", "CAP-23", "CAP-25"]
after = [{ epic = 6, needs = "every screen in place" }]
