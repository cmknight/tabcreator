# tickets.toml — a container's agreed children. tickets.py reads it.
# The order of the tables is the build order: move a table to reorder. `id` names a child for good and is never reused.
# Status never lives here: an entry's plan beside it carries `status`.

[[entry]]
id = 1
type = "story"
title = "Split the recording store"
description = "Splits app/src/session/recording-session.ts so it keeps only mic lifecycle, devices and prefs, moving input quality, the tuner reading and ticks, and level warnings into their own modules or a tuner store behind the same snapshot, with no behaviour change, before the recorder, count-in and recovery scan land."
verify = "Full CI is green, every existing recording-session test passes with its intent unchanged, and the store file holds only mic lifecycle, devices and prefs while set() handles only mic transitions."
covers = []
after = ["epic-mic-and-tuner"]
hitl = false
risk = "medium"
references = [
  "retrospective — _bmad-output/initiative-tabcreator-v1/epic-mic-and-tuner/epic-mic-and-tuner-retrospective.md, God-class / size growth and action A1",
  "architecture — _bmad-output/planning-artifacts/architecture/architecture-tabcreator-2026-09-28/ARCHITECTURE-SPINE.md, AD-3",
]
notes = ["the store split (A1) should be the first story of the Recording epic"]

[[entry]]
id = 2
type = "story"
title = "Serialise mic input transitions"
description = "Replaces the shared busy flag in recording-session with one serialised path for allow, switch, unplug fallback and lost, so a racing transition never leaves a second input open (epic 2 retro A3), and makes the mic-select unplug e2e stable under repeated runs (retro A4)."
verify = "Unit tests that interleave a select during the unplug fallback, a track ending during a switch, and an unplug while requesting each end with exactly one open input whose device matches activeDeviceId, and mic-select.dev.spec.ts passes at --repeat-each=10 --workers=4 --retries=0."
covers = []
after = [1]
hitl = false
risk = "medium"
references = ["retrospective — _bmad-output/initiative-tabcreator-v1/epic-mic-and-tuner/epic-mic-and-tuner-retrospective.md, Diff-scope review 2-3 and 16, actions A3 and A4"]

[[entry]]
id = 3
type = "story"
title = "Queue announcements"
description = "Changes app/src/ui/a11y/announcer.ts so polite messages announced in the same frame are all spoken in order instead of the last replacing the others, removes the Tuner's All-six delay workaround, and adds retro A4's UI tests: the quality banner on the Tuner with Dismiss focusing the Tuner h1, and All six announced on unmount only while the mic is live."
verify = "A dev e2e where the switch toast and the quality banner announce together records both texts in the polite region in order, the Tuner still announces the sixth string and All six, and the two retro A4 Tuner tests pass."
covers = []
after = []
hitl = false
risk = "low"
references = ["retrospective — _bmad-output/initiative-tabcreator-v1/epic-mic-and-tuner/epic-mic-and-tuner-retrospective.md, Diff-scope review 1, 5 and 6, actions A2 and A4"]

[[entry]]
id = 4
type = "story"
title = "Record and stop a take (tracer)"
description = "Adds the capture path end to end: audio/ exposes the live input's graph, a recorder worklet posts raw blocks batched into 1 s chunks appended through the OPFS worker (blocks that arrive before createTake resolves are held and appended first, AD-9), a gated MediaStreamDestination feeds MediaRecorder at Opus 96 kbps, recording-session gains record() and stop('user') with createTake at the click (entry 6 moves it to count-in end) and the stop pipeline (writeCompressed, patchTake recorded), capture keeps running when the player leaves Record, and Record shows the Record/Stop button (aria-pressed, dot then square, Recording state) with the m:ss timer and opens #/tab/<id> on stop."
verify = "On the dev build with ?fakeMic=c_major_scale_pos1, Record then Stop after about 5 s opens #/tab/<id> with the take recorded, durationMs within 50 ms of the audio-clock time between capture start and stop and of the raw chunk length, and a webm/opus file that decodes; leaving for Library mid-take and returning to Stop gives the full duration."
covers = ["CAP-5", "CAP-6"]
after = [2, "epic-platform-baseline"]
hitl = false
risk = "high"
unknown = "How the recorder worklet module is bundled and loaded under Vite 8 with the strict CSP (a same-origin file for addModule)."
references = [
  "architecture — _bmad-output/planning-artifacts/architecture/architecture-tabcreator-2026-09-28/ARCHITECTURE-SPINE.md, AD-2, AD-9, AD-13, AD-14, AD-15",
  "stories — TabCreator-User-Stories.md, US-3.1",
  "design — _bmad-output/planning-artifacts/ux-designs/ux-tabcreator-2026-09-27/DESIGN.md, Record button",
  "design — _bmad-output/planning-artifacts/ux-designs/ux-tabcreator-2026-09-27/mockups/record.html, Record button and timer states",
]

[[entry]]
id = 5
type = "story"
title = "Space to record and the production test lane"
description = "Adds app/src/ui/a11y/shortcuts.ts as the only shortcut registry with the text-field guard, registers Space to start and stop recording on Record, emits performance marks at keydown and at the first captured worklet block in every build, and adds a production Playwright lane using Chrome's native fake device fed a looping noisy fixture through --use-file-for-fake-audio-capture under the real autoplay policy, with retro A4's production rows (a no-prompt row for #/tuner and a native-fake-device recording)."
verify = "On the production lane Space starts a take within 100 ms by the two performance marks and stops it, Space in a text field does nothing, and the #/tuner no-prompt row passes."
covers = ["CAP-5"]
after = [4]
hitl = false
risk = "low"
references = [
  "experience — _bmad-output/planning-artifacts/ux-designs/ux-tabcreator-2026-09-27/EXPERIENCE.md, Interaction Primitives",
  "architecture — _bmad-output/planning-artifacts/architecture/architecture-tabcreator-2026-09-28/ARCHITECTURE-SPINE.md, AD-18",
  "retrospective — _bmad-output/initiative-tabcreator-v1/epic-mic-and-tuner/epic-mic-and-tuner-retrospective.md, Process and action A4",
]

[[entry]]
id = 6
type = "story"
title = "Count-in"
description = "Adds audio/metronome.ts scheduling four clicks on the audio clock (30 ms sines, 1500 Hz then 1000 Hz, -12 dBFS) and replaces entry 4's start path so capture and createTake open at beat five, with the count-in toggle and BPM (40-240, persisted, disabled while recording), the large 4-3-2-1 in place of the timer, Cancel on the button, Esc registered in the shortcuts registry to cancel, beats announced assertively through the announcer, countInBpm stored only when on, and a dev-only hook exposing the audio-clock times of the click and of capture start."
verify = "At 120 BPM the capture starts 2.0 s after the click within 20 ms on the audio clock by the dev hook, a take recorded from silence_60s has no click energy at 1000 or 1500 Hz in the raw or decoded audio (Goertzel), and Esc or Cancel during the count-in creates no take."
covers = ["CAP-7"]
after = [5, 3]
hitl = false
risk = "medium"
unknown = "The scheduling lead before beat one; the 2.0 s is measured from the click's audio-clock time, not from beat one."
references = [
  "stories — TabCreator-User-Stories.md, US-3.3",
  "design — _bmad-output/planning-artifacts/ux-designs/ux-tabcreator-2026-09-27/mockups/record.html, count-in states",
]

[[entry]]
