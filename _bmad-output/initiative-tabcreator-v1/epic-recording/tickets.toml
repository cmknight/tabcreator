[[entry]]
id = 9
type = "story"
title = "Failure stops keep the take"
description = "Stops and saves the take on Record when the mic is lost, revoked or unplugged mid-take (stopReason mic-lost, no fallback to another input) or when storage fills (new stopReason storage-full with a no-op schema version bump and fixture test per AD-11, error banner \"Storage is full — recording stopped and saved\" with a link to the Library), with a dev-only hook that makes OPFS appends reject with QuotaExceededError."
verify = "With two fake devices, unplugging the active one 3 s into a take saves a recorded take of about 3 s with stopReason mic-lost and shows \"Microphone disconnected — recording stopped and saved\"; revoking does the same and shows \"Microphone access was lost\"; the storage-full hook saves the take with stopReason storage-full and shows the banner."
covers = ["CAP-25", "CAP-26"]
after = [7, 8]
hitl = false
risk = "high"
unknown = "When the quota is exhausted the stop's own writeCompressed and patchTake may also fail; the take then stays recording with its raw chunks for entry 11's recovery."
references = [
  "stories — TabCreator-User-Stories.md, US-1.1, US-1.2 mid-take",
  "experience — _bmad-output/planning-artifacts/ux-designs/ux-tabcreator-2026-09-27/EXPERIENCE.md, Mic access lost mid-session and Device unplugged rows",
  "architecture — _bmad-output/planning-artifacts/architecture/architecture-tabcreator-2026-09-28/ARCHITECTURE-SPINE.md, AD-10, AD-11, AD-15",
]

[[entry]]
id = 10
type = "story"
title = "One tab at a time"
description = "Adds app/src/session/instance-lock.ts holding the Web Lock tabcreator-instance before any storage write, the \"TabCreator is open in another tab\" screen with Use here (BroadcastChannel request, 3 s wait, then steal), the releasing tab stopping its take with stopReason instance-lost, flushing, closing IndexedDB (new db close) and fencing writes, and the versionchange and blocked screens; without navigator.locks the app does not start (unsupported browser, CAP-22 in epic-offline-accessibility-budgets)."
verify = "With two Playwright pages, the second shows the screen, Use here hands over within 3 s, a take recording in the first tab is saved with stopReason instance-lost, and later writes from the first tab reject with instance-taken."
covers = ["CAP-29"]
after = [9]
hitl = false
risk = "high"
unknown = "Whether a backgrounded releasing tab can finish MediaRecorder and writeCompressed inside the 3 s window; if not, the take stays recording and entry 11 recovers it with stopReason recovered."
references = [
  "architecture — _bmad-output/planning-artifacts/architecture/architecture-tabcreator-2026-09-28/ARCHITECTURE-SPINE.md, AD-6, AD-16",
  "stories — TabCreator-User-Stories.md, US-8.5",
]

[[entry]]
id = 11
type = "story"
title = "Recover an unfinished take"
description = "Runs the recovery scan after the lock is held, finding takes with status recording and deleting orphan raw and compressed files and takes under 0.5 s silently, shows \"An unfinished take from <time> was recovered (m:ss)\" on Record with Open and Discard, and on Open re-encodes the raw chunks through the graph (WAV, newly added to the format table, if encoding fails), never overwriting existing compressed audio, sets recorded with stopReason recovered and opens #/tab/<id>; it also adds the beforeunload warning while recording."
verify = "Reloading 10 s into a dev recording (accepting the beforeunload dialog) shows the banner with at least 9 s, Open lands on #/tab/<id> with the take recorded, stopReason recovered and compressed audio that decodes to at least 9 s, Discard removes the take and its files, and the banner never offers a take another tab is still recording."
covers = ["CAP-6", "CAP-29"]
after = [10]
hitl = false
risk = "high"
unknown = "Re-encoding through MediaRecorder runs in real time, so recovering a 5-minute take takes about 5 minutes; the WAV fallback breaks the 5 MB budget."
references = [
  "architecture — _bmad-output/planning-artifacts/architecture/architecture-tabcreator-2026-09-28/ARCHITECTURE-SPINE.md, AD-9, AD-11, AD-15",
  "stories — TabCreator-User-Stories.md, US-3.2",
