title = "Length cap, short takes and recording announcements"
description = "Adds the 4:30 warning \"30 seconds left\" announced once, the auto-stop at 5:00 saved with stopReason max-length (the Tab epic shows its toast), discarding takes under 0.5 s with \"Too short — nothing recorded\", start and stop announcements, app reload refused while recording, a dev-only cap override (?maxTakeMs, DEV only), and one @slow test on entry 5's production lane."
verify = "With the dev cap override the warning and auto-stop appear, a 0.3 s take is discarded with its message, and the @slow production test records the full 5 minutes, auto-stops and keeps compressed audio at or under 5 MB."
covers = ["CAP-5", "CAP-25"]
after = [6]
hitl = false
risk = "medium"
unknown = "Whether the @slow 5-minute test runs on every CI push or only on main."
references = [
  "experience — _bmad-output/planning-artifacts/ux-designs/ux-tabcreator-2026-09-27/EXPERIENCE.md, Recording near limit and Take too short rows",
