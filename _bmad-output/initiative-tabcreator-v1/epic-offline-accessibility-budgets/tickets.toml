[[entry]]
id = 7
type = "story"
title = "Bundle and wasm size gates"
description = "Adds a CI step and script that fail the build when the gzip size of the entry chunk plus every chunk it imports statically (user decision: CSS, workers, worklets and lazy chunks excluded) exceeds 200 KB, or the .wasm exceeds 1 MB gz, reading limits from one budgets config that stories 8 and 9 also use, and printing the measured sizes in the job summary (AD-17); it follows story 4 so every playwright.config.ts and ci.yml change stays on one path."
verify = "The script reports today's sizes (about 135 KB and 103 KB gz) and passes; a test or a CI dry run with the limits lowered below them fails with the offending number."
covers = ["CAP-23"]
after = [4]
hitl = false
risk = "low"
references = ["stories — TabCreator-User-Stories.md, US-8.3", "architecture — ARCHITECTURE-SPINE.md, AD-17"]

[[entry]]
