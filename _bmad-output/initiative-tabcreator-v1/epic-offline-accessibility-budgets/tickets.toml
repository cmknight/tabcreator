type = "story"
title = "60 s analysis benchmark gate"
description = "Adds tools/benchmark.ts (AD-17, US-8.3): it analyses c_major_scale_pos1 looped to 60 s in the real engine worker in Chromium against the production build, one warm-up then the median of 5 runs, scaled by a calibration factor in benchmark.config.json, and fails CI above the 2.0 s limit read from story 7's budgets config; it owns the production seeding helper (a fixture backup restored through the real Restore path) that stories 9 and 13 reuse; it also reports the cold first analysis and the peak memory of a 5-minute take (Detection retro WK2) without gating them."
verify = "CI runs the benchmark on every change and passes with the measured median, cold time and peak memory in the job summary; lowering the limit below the measured median fails the job."
