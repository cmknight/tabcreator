verify = "Vitest runs the check with each API removed in turn; prod Playwright with an init script deleting each API shows the unsupported screen with no app shell and passes axe, and a full browser starts normally."
covers = ["CAP-22", "CAP-25"]
after = [4]
hitl = false
risk = "low"
references = ["stories — TabCreator-User-Stories.md, US-8.3 (capability detection)", "architecture — ARCHITECTURE-SPINE.md, AD-6, map (capability check in main.tsx)", "design — DESIGN.md, unsupported screen"]

