# tickets.toml — a container's agreed children. tickets.py reads it.
# The order of the tables is the build order: move a table to reorder. `id` names a child for good and is never reused.
# Status never lives here: an entry's plan beside it carries `status`.

[[entry]]
id = 1
type = "story"
title = "Storage-full status that clears when space is freed"
description = "Lands Library retro B1: storage/persistence.ts clears the storage-full status only when space is actually freed (a take deleted, a take's audio deleted, or an estimate() re-check showing room), never on a rename, a createTake or a restore that imported nothing, and re-checks estimate() at startup so a full disk shows again after a reload; the footer usage is re-read after the files are removed; Record and the Library read one storage-full source (take-lifecycle's own flag goes); the Library banner is built on StorageFullBannerView and announced through the announcer (AD-18), with one string for the three identical texts; story 11's any-screen notice reads this same source; the CI dist grep gains __storageFullSaveHook and assertDevSaveSpace (Library retro B4)."
verify = "Vitest on persistence pins the new clear rules (delete take and delete audio clear, rename, createTake and a 0-take restore do not) and dev e2e shows the Library banner clearing after Delete take and staying after a rename, with Record's banner following the same status; axe passes on the Library banner."
covers = ["CAP-25"]
after = ["6.9"]
hitl = false
risk = "medium"
references = ["retrospective — _bmad-output/initiative-tabcreator-v1/epic-library-and-export/epic-library-and-export-retrospective.md, action B1 and findings DS1, DS2, AV3, DM1, PD2", "architecture — ARCHITECTURE-SPINE.md, AD-5, AD-18"]

[[entry]]
id = 2
type = "story"
title = "Restore validation and missing audio"
description = "Lands the first half of Library retro B2 with the user's decisions: a take whose audio is missing from the zip is imported with audioMime null (shown as Audio deleted), restore never adds audio to a take already in the library, persistence is requested after a restore that imported takes, the manifest gains schemaVersion (DB_VERSION) and import runs the record migrations from it, the validator's status and stop-reason lists satisfy the model unions with domain checks (title cap, trim range, createdAt, note endMs ≥ startMs, fret range, recorded-without-audio, extension vs audioMime), re-zipped backups (a top-level folder, dotfiles, Thumbs.db) are accepted, and the backup toast reports skipped unfinished takes; story 16 then makes the read streaming, and story 9 seeds its production gates through this Restore path."
verify = "Vitest covers every stop reason and status round-tripping, each domain rejection, a re-zipped backup, missing audio restoring as audioMime null and schemaVersion migration; dev e2e shows a missing-audio take as Audio deleted and the skipped-unfinished count in the backup toast."
covers = ["CAP-19"]
after = [1]
hitl = false
risk = "high"
references = ["retrospective — _bmad-output/initiative-tabcreator-v1/epic-library-and-export/epic-library-and-export-retrospective.md, action B2, findings DS3–DS8, DM3, and the user's answers in Open questions", "architecture — ARCHITECTURE-SPINE.md, AD-11, AD-14, AD-15"]

[[entry]]
id = 16
type = "story"
title = "Streaming restore and restore races"
description = "Lands the second half of Library retro B2: restore reads the zip in pieces with fflate's streaming Unzip in the backup worker (user decision: no backup size cap), writing each audio entry as it arrives after the manifest has validated, so any backup that can be made can be restored; audio written for ids that importTakes then skips is removed; the recovery scan cannot delete restored audio while a restore runs, through a \"restore is running\" signal this story owns and story 17 also reads; a rollback under the write fence reports honestly instead of \"nothing was changed\"; it builds on story 2's validator and schemaVersion."
verify = "Vitest covers the skipped-id cleanup, the scan race and the fenced rollback message; a dev e2e (or a worker test on a multi-hundred-MB synthetic zip) restores a backup larger than the old in-memory path allowed with peak memory well under the file size."
covers = ["CAP-19"]
after = [2]
hitl = false
risk = "high"
unknown = "fflate's streaming Unzip API inside the backup worker, and whether the manifest can be validated before the audio entries arrive (zip entry order)."
references = ["retrospective — _bmad-output/initiative-tabcreator-v1/epic-library-and-export/epic-library-and-export-retrospective.md, action B2, findings DS6–DS8, and the user's answers in Open questions", "architecture — ARCHITECTURE-SPINE.md, AD-11, AD-14, AD-15"]

[[entry]]
id = 17
type = "story"
title = "Library robustness during backup and restore"
description = "Lands Library retro B3: library-session refuses or queues rename, delete take and delete audio while a backup or restore runs (not only the row menu), reading story 16's \"restore is running\" signal, the backup worker treats an entry that vanishes mid-read as missing rather than failing the whole backup, ui/platform.ts keeps a large download's object URL alive long enough (a longer revoke delay or revoke on pagehide), pickFile always settles (a timeout or visibilitychange when neither cancel nor focus fires) and a late change still resolves, and a backup finishing after the player left the Library is offered on return instead of downloading unannounced."
verify = "Vitest covers the session refusing writes during a backup and restore, a vanished entry, the revoke timing and pickFile settling without cancel or focus; dev e2e shows a delete attempted during a backup refused with its reason."
covers = ["CAP-19"]
after = [16]
hitl = false
risk = "medium"
references = ["retrospective — _bmad-output/initiative-tabcreator-v1/epic-library-and-export/epic-library-and-export-retrospective.md, action B3, findings DS9, DS14"]

[[entry]]
id = 3
type = "story"
title = "Installable offline app (tracer)"
description = "Adds vite-plugin-pwa (AD-19: registerType prompt, registered through an external script per AD-13, relative base so scope and start_url work under /tabcreator/), a manifest named TabCreator (standalone, theme colours generated from theme.css tokens per AD-12, icons 192, 512 and maskable from a simple token-coloured glyph the builder generates as SVG and rasterises, user decision, replaceable later), and a precache of the shell, JS, CSS, fonts, icons, every worker and worklet chunk and the .wasm; it proves the whole path with the network off: after one online visit, a prod-mic Playwright run records, analyses, edits and exports offline; ci.yml checks dist for the manifest and service worker; story 4 adds the update prompt on top of this registration."
verify = "Prod-mic Playwright: the manifest validates, the service worker is registered and controls the page, Chromium reports the app installable, and with context.setOffline(true) and a reload the player records a take, it analyses, a note is edited and the tab is copied and downloaded; the same install check passes on the subpath project, and csp.spec still reports no violations."
covers = ["CAP-20"]
after = [17]
hitl = false
risk = "high"
unknown = "Whether vite-plugin-pwa 1.3.0 (spine Stack) supports Vite 8.3.1 and the inline-script ban without a manual virtual:pwa-register; and whether the precache glob can include the .wasm and every worker chunk without listing hashes."
references = ["stories — TabCreator-User-Stories.md, US-8.1", "architecture — ARCHITECTURE-SPINE.md, AD-12, AD-13, AD-19, Stack", "design — DESIGN.md (colours)"]

[[entry]]
id = 4
type = "story"
title = "Update available prompt"
description = "Shows the global toast \"Update available — Reload\" when story 3's registration finds a waiting service worker, only while session/app-reload.ts isAppBusy() is false (recording, analysing and unsaved edits; re-offered when it becomes false), with Reload going through session/app-reload.ts, which now awaits a flushAll() across stores with pending writes before reloading (AD-16); the update-blocked screen stays the path when a DB upgrade is blocked by another tab; story 13 maps its two-build test as the update-available state."
verify = "Prod Playwright serves build A, then build B: the toast appears once idle, not during a recording (it appears after Stop), and Reload lands on build B with no lost edit; Vitest covers the idle gate and flushAll ordering."
covers = ["CAP-20", "CAP-25"]
after = [3]
hitl = false
risk = "medium"
unknown = "How to serve two builds in one Playwright run so a real service-worker update is detected."
references = ["stories — TabCreator-User-Stories.md, US-8.1", "architecture — ARCHITECTURE-SPINE.md, AD-16, AD-19", "experience — EXPERIENCE.md, State Patterns: update available, update blocked"]

