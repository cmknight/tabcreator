<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 512' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width='760' height='512' fill='#ffffff'/>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8a8f98'/></marker></defs>
<text x='24' y='34' font-size='15' font-weight='600' fill='#1f2328'>Audio is saved first, then analyzed on the device into an editable tab</text>
<rect x='24' y='64' width='712' height='120' rx='8' fill='#f2f4f7'/>
<text x='720' y='86' text-anchor='end' font-size='11.5' font-weight='600' fill='#5b6270'>1 Capture (UI thread)</text>
<rect x='40' y='96' width='200' height='72' rx='8' fill='#ffffff' fill-opacity='1' stroke='#8a8f98' stroke-width='1.25'/>
<text x='52' y='120' font-weight='600' fill='#1f2328'>Mic input</text>
<text x='52' y='136' font-size='11.5' fill='#5b6270'>getUserMedia, mono</text>
<text x='52' y='152' font-size='11.5' fill='#5b6270'>tuner and level meter</text>
<rect x='280' y='96' width='200' height='72' rx='8' fill='#ffffff' fill-opacity='1' stroke='#8a8f98' stroke-width='1.25'/>
<text x='292' y='120' font-weight='600' fill='#1f2328'>Recorder</text>
<text x='292' y='136' font-size='11.5' fill='#5b6270'>AudioWorklet buffers PCM</text>
<text x='292' y='152' font-size='11.5' fill='#5b6270'>count-in, 5-minute cap</text>
<rect x='520' y='96' width='200' height='72' rx='8' fill='#3b6fd8' fill-opacity='0.12' stroke='#3b6fd8' stroke-width='2'/>
<text x='532' y='120' font-weight='600' fill='#1f2328'>Take store</text>
<text x='532' y='136' font-size='11.5' fill='#5b6270'>audio saved on device</text>
<text x='532' y='152' font-size='11.5' fill='#5b6270'>before analysis starts</text>
<path d='M240 132H280' stroke='#8a8f98' stroke-width='1.25' fill='none' marker-end='url(#a)'/>
<path d='M480 132H520' stroke='#8a8f98' stroke-width='1.25' fill='none' marker-end='url(#a)'/>
<rect x='24' y='216' width='712' height='120' rx='8' fill='#f2f4f7'/>
<text x='720' y='238' text-anchor='end' font-size='11.5' font-weight='600' fill='#5b6270'>2 Analysis engine (Web Worker + WebAssembly)</text>
<rect x='40' y='248' width='200' height='72' rx='8' fill='#ffffff' fill-opacity='1' stroke='#8a8f98' stroke-width='1.25'/>
<text x='52' y='272' font-weight='600' fill='#1f2328'>Pitch and onsets</text>
<text x='52' y='288' font-size='11.5' fill='#5b6270'>pYIN pitch per frame</text>
<text x='52' y='304' font-size='11.5' fill='#5b6270'>spectral-flux onsets</text>
<rect x='280' y='248' width='200' height='72' rx='8' fill='#ffffff' fill-opacity='1' stroke='#8a8f98' stroke-width='1.25'/>
<text x='292' y='272' font-weight='600' fill='#1f2328'>Note builder</text>
<text x='292' y='288' font-size='11.5' fill='#5b6270'>frames merged into notes</text>
<text x='292' y='304' font-size='11.5' fill='#5b6270'>noise and glitches dropped</text>
<rect x='520' y='248' width='200' height='72' rx='8' fill='#ffffff' fill-opacity='1' stroke='#8a8f98' stroke-width='1.25'/>
<text x='532' y='272' font-weight='600' fill='#1f2328'>Fret mapper</text>
<text x='532' y='288' font-size='11.5' fill='#5b6270'>Viterbi over string/fret</text>
<text x='532' y='304' font-size='11.5' fill='#5b6270'>least hand movement</text>
<path d='M240 284H280' stroke='#8a8f98' stroke-width='1.25' fill='none' marker-end='url(#a)'/>
<path d='M480 284H520' stroke='#8a8f98' stroke-width='1.25' fill='none' marker-end='url(#a)'/>
<rect x='24' y='368' width='712' height='120' rx='8' fill='#f2f4f7'/>
<text x='720' y='390' text-anchor='end' font-size='11.5' font-weight='600' fill='#5b6270'>3 Tab and library (UI thread)</text>
<rect x='40' y='400' width='200' height='72' rx='8' fill='#ffffff' fill-opacity='1' stroke='#8a8f98' stroke-width='1.25'/>
<text x='52' y='424' font-weight='600' fill='#1f2328'>Tab model</text>
<text x='52' y='440' font-size='11.5' fill='#5b6270'>time, pitch, string, fret</text>
<text x='52' y='456' font-size='11.5' fill='#5b6270'>confidence per note</text>
<rect x='280' y='400' width='200' height='72' rx='8' fill='#ffffff' fill-opacity='1' stroke='#8a8f98' stroke-width='1.25'/>
<text x='292' y='424' font-weight='600' fill='#1f2328'>Tab editor</text>
<text x='292' y='440' font-size='11.5' fill='#5b6270'>ASCII render, edit, undo</text>
<text x='292' y='456' font-size='11.5' fill='#5b6270'>playback cursor</text>
<rect x='520' y='400' width='200' height='72' rx='8' fill='#ffffff' fill-opacity='1' stroke='#8a8f98' stroke-width='1.25'/>
<text x='532' y='424' font-weight='600' fill='#1f2328'>Library and export</text>
<text x='532' y='440' font-size='11.5' fill='#5b6270'>saved on device</text>
<text x='532' y='456' font-size='11.5' fill='#5b6270'>copy or share as .txt</text>
<path d='M240 436H280' stroke='#8a8f98' stroke-width='1.25' fill='none' marker-end='url(#a)'/>
<path d='M480 436H520' stroke='#8a8f98' stroke-width='1.25' fill='none' marker-end='url(#a)'/>
<path d='M620 168V200H140V248' stroke='#8a8f98' stroke-width='1.25' fill='none' marker-end='url(#a)'/>
<path d='M620 320V352H140V400' stroke='#8a8f98' stroke-width='1.25' fill='none' marker-end='url(#a)'/>
</svg>